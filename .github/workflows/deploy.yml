name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build-and-publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Doppler may sync under any names. Read all Actions secrets, print key
      # names for debugging, and normalize onto VITE_SUPABASE_* for Vite.
      - name: Resolve Supabase secrets
        id: supabase
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const secrets = JSON.parse(process.env.SECRETS_CONTEXT || '{}')
          const keys = Object.keys(secrets)
          console.log('Secret keys visible to this job:')
          for (const key of keys) console.log(`  - ${key}`)

          function first(map, names) {
            for (const key of names) {
              const value = String(map[key] ?? '').trim()
              if (value) return { key, value }
            }
            return null
          }

          function fuzzy(map, pred) {
            for (const [key, raw] of Object.entries(map)) {
              const value = String(raw ?? '').trim()
              if (!value) continue
              if (pred(key)) return { key, value }
            }
            return null
          }

          const url =
            first(secrets, [
              'VITE_SUPABASE_URL',
              'SUPABASE_URL',
              'NEXT_PUBLIC_SUPABASE_URL',
              'PUBLIC_SUPABASE_URL',
            ]) ||
            fuzzy(secrets, (k) => /supabase/i.test(k) && /url/i.test(k))

          const anon =
            first(secrets, [
              'VITE_SUPABASE_ANON_KEY',
              'VITE_SUPABASE_ANON',
              'SUPABASE_ANON_KEY',
              'SUPABASE_ANON',
              'NEXT_PUBLIC_SUPABASE_ANON_KEY',
              'PUBLIC_SUPABASE_ANON_KEY',
            ]) ||
            fuzzy(secrets, (k) => /supabase/i.test(k) && /anon/i.test(k))

          const related = keys.filter((k) => /supabase/i.test(k))
          console.log('Supabase-related keys:', related.join(', ') || '(none)')

          if (!url || !anon) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ok=false\n')
            console.error('Could not resolve Supabase URL + anon key from Actions secrets.')
            process.exit(0)
          }

          console.log(`Using URL from ${url.key}; anon from ${anon.key}`)
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `VITE_SUPABASE_URL<<EOF\n${url.value}\nEOF\n` +
              `SUPABASE_URL<<EOF\n${url.value}\nEOF\n` +
              `VITE_SUPABASE_ANON_KEY<<EOF\n${anon.value}\nEOF\n` +
              `SUPABASE_ANON<<EOF\n${anon.value}\nEOF\n`,
          )
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ok=true\n')
          NODE

      - name: Fail if Supabase secrets are missing
        if: steps.supabase.outputs.ok != 'true'
        run: |
          echo "::error::No Supabase credentials in GitHub Actions for this job. In Doppler → Integrations → GitHub, sync to this repo's Actions secrets (names like SUPABASE_URL + SUPABASE_ANON). Run the Inspect Actions secrets workflow to see which keys GitHub has. If secrets are in a GitHub Environment, re-sync Doppler to repository secrets or run Inspect with that environment name."
          exit 1

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ./

      - name: Commit built site to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes to commit"
          else
            git commit -m "chore: update GitHub Pages build in docs/"
            git push
          fi
