name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build-and-publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Doppler's GitHub integration syncs project secrets into GitHub Actions
      # secrets (e.g. SUPABASE_URL, SUPABASE_ANON). Pass them into the Vite
      # build so they are baked into the static GitHub Pages bundle.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ./
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Supabase env was present for build
        run: |
          if [ -z "${SUPABASE_URL:-}${VITE_SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON:-}${SUPABASE_ANON_KEY:-}${VITE_SUPABASE_ANON:-}${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::No Supabase URL/anon secrets found in GitHub Actions. The site will stay localStorage-only. Confirm Doppler is syncing SUPABASE_URL and SUPABASE_ANON (or VITE_*) into this repo's Actions secrets."
          else
            echo "Supabase credentials detected for this build."
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Commit built site to docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "No docs changes to commit"
          else
            git commit -m "chore: update GitHub Pages build in docs/"
            git push
          fi
