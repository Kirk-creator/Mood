name: Inspect Actions secrets

# Lists secret/variable *names* available to a workflow (values stay masked).

on:
  workflow_dispatch:
    inputs:
      secrets_environment:
        description: GitHub Environment to inspect (default github-pages for Doppler sync)
        required: false
        type: string
        default: github-pages

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: ${{ inputs.secrets_environment }}
    steps:
      - name: List secret and variable keys
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          VARS_CONTEXT: ${{ toJson(vars) }}
        run: |
          echo "Environment: ${{ inputs.secrets_environment }}"
          echo
          echo "Secret keys:"
          echo "$SECRETS_CONTEXT" | jq -r 'keys[]' | sed 's/^/  - /'
          echo
          echo "Variable keys:"
          echo "$VARS_CONTEXT" | jq -r 'keys[]' | sed 's/^/  - /'
          echo
          echo "Supabase-looking secret keys:"
          echo "$SECRETS_CONTEXT" | jq -r 'keys[]' | grep -i supabase || echo '  (none)'
          echo "Supabase-looking variable keys:"
          echo "$VARS_CONTEXT" | jq -r 'keys[]' | grep -i supabase || echo '  (none)'
