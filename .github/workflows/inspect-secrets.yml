name: Inspect Actions secrets

# Lists secret *names* available to a workflow (values stay masked).
# Use this to see what Doppler actually synced into GitHub.

on:
  workflow_dispatch:
    inputs:
      secrets_environment:
        description: Optional GitHub Environment name to inspect (leave empty for repo secrets)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  inspect-repo-secrets:
    if: ${{ inputs.secrets_environment == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: List repository secret keys
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          echo "Repository Actions secret keys:"
          echo "$SECRETS_CONTEXT" | jq -r 'keys[]' | sed 's/^/  - /'
          echo
          echo "Supabase-looking keys:"
          echo "$SECRETS_CONTEXT" | jq -r 'keys[]' | grep -i supabase || echo '  (none)'

  inspect-environment-secrets:
    if: ${{ inputs.secrets_environment != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.secrets_environment }}
    steps:
      - name: List environment secret keys
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          echo "Environment '${{ inputs.secrets_environment }}' secret keys:"
          echo "$SECRETS_CONTEXT" | jq -r 'keys[]' | sed 's/^/  - /'
          echo
          echo "Supabase-looking keys:"
          echo "$SECRETS_CONTEXT" | jq -r 'keys[]' | grep -i supabase || echo '  (none)'
