<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pulse — track mood, exercise, well-being, and energy to spot health correlations."
    />
    <title>Pulse · Mood & Health Tracker</title>
    <script>
      // GitHub Pages currently serves the repo root (Vite source). Redirect to
      // the production build in /docs so the app is not a blank page.
      (function () {
        var host = location.hostname
        if (host.endsWith('github.io') || host.endsWith('github.com')) {
          var base = location.pathname.replace(/\/index\.html$/, '/')
          if (!/\/docs\/?$/.test(base)) {
            location.replace(base.replace(/\/?$/, '/') + 'docs/')
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
